name: Release

# Bump package.json in a PR, then tag main with the same version: git tag v0.2.1 && git push origin v0.2.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($want)" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # Uploads nod-<version>.AppImage and latest-linux.yml, which the in-app updater reads.
      - name: Build and publish
        run: pnpm build && node scripts/build-electron.mjs && pnpm exec electron-builder --linux AppImage --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One APK for every server: the app asks for its server on first launch.
  android:
    needs: appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # versionCode is major*10000 + minor*100 + patch, so every release installs over the last.
      - name: Version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Signing key
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Build APK
        working-directory: android
        run: >
          ./gradlew assembleRelease
          -PnodPackage=${{ vars.ANDROID_PACKAGE_ID }}
          -PnodVersionCode=${{ steps.version.outputs.code }}
          -PnodVersionName=${{ steps.version.outputs.name }}
        env:
          NOD_KEYSTORE: ${{ runner.temp }}/release.keystore
          NOD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Attach to the release
        run: |
          apk="nod-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
