// Hand-kept since the Bubblewrap scaffold. One APK serves every Nod server: the host is set on
// the phone at first launch, never at build time.

plugins {
    id 'com.android.application'
}

// CI sets these from the release tag and repo settings; `pnpm android:build` passes its own.
def nodPackage = project.findProperty('nodPackage') ?: 'dev.example.nod'
def nodVersionCode = (project.findProperty('nodVersionCode') ?: '1') as int
def nodVersionName = project.findProperty('nodVersionName') ?: '1.0.0'
def nodKeystore = System.getenv('NOD_KEYSTORE')

def dark = '#0D1117'

android {
    compileSdkVersion 36
    namespace "dev.example.nod"
    defaultConfig {
        applicationId nodPackage
        minSdkVersion 24
        targetSdkVersion 36
        versionCode nodVersionCode
        versionName nodVersionName

        resValue "string", "appName", "Nod"
        resValue "string", "launcherName", "Nod"

        // TWA status bar, navigation bar and splash colours.
        resValue "color", "colorPrimary", dark
        resValue "color", "colorPrimaryDark", dark
        resValue "color", "navigationColor", dark
        resValue "color", "navigationColorDark", dark
        resValue "color", "navigationDividerColor", dark
        resValue "color", "navigationDividerColorDark", dark
        resValue "color", "backgroundColor", dark

        resValue "string", "providerAuthority", nodPackage + '.fileprovider'
        resValue "bool", "enableNotification", "true"
        resValue "integer", "splashScreenFadeOutDuration", "300"
        resValue "string", "generatorApp", "bubblewrap-cli"
        resValue "string", "fallbackType", "customtabs"
        resValue "bool", "enableSiteSettingsShortcut", "true"
        resValue "string", "orientation", "default"
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (nodKeystore) {
            release {
                storeFile file(nodKeystore)
                storePassword System.getenv('NOD_KEYSTORE_PASSWORD')
                keyAlias 'review-inbox'
                keyPassword System.getenv('NOD_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            if (nodKeystore) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    implementation 'com.google.android.material:material:1.12.0'
    // QR decoding on the camera with ZXing; needs no Google Play Services.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation 'junit:junit:4.13.2'
}
