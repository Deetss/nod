appId: dev.example.nod
productName: nod
executableName: nod
asar: false
npmRebuild: false
directories:
  output: release
files:
  - package.json
  - dist/web/**
  - dist/electron/**
  - electron/assets/**
  - "!**/node_modules/**"
linux:
  target: AppImage
  artifactName: nod-${version}.AppImage
  category: Development
  icon: electron/assets/icon-512.png
# Owner and repo come from package.json `repository`.
publish:
  provider: github
  # The updater skips drafts, so publish straight to a release.
  releaseType: release
