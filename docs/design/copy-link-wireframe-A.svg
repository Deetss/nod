<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="870" viewBox="0 0 1660 870"><rect width="1660" height="870" fill="#fff"/><text x="16" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Layout A - a link icon button on every item (desktop 1660x870)</text><text x="16" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444" text-anchor="start">Round 1, greyscale. Header icons always show. Row, check and comment icons show on hover or focus. Key Y copies the focused item's link. Sample data synthetic.</text><rect x="10" y="56" width="540" height="395" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="22" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">1 Issue header</text><line x1="22" y1="83" x2="538" y2="83" stroke="#999"/><text x="30" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Rebuild the banner export pipeline</text><rect x="30" y="140" width="54" height="20" rx="10" fill="#ddd" stroke="#333" stroke-width="1"/><text x="57.0" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Open</text><text x="94" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">acme-dev/notes #12 . opened 6d ago</text><rect x="310" y="100" width="74" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="347.0" y="118.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">Edit title</text><rect x="392" y="100" width="28" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><rect x="397.0" y="110.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="404.0" y="110.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="428" y="100" width="28" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="442.0" y="118.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">^</text><rect x="462" y="100" width="28" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="476.0" y="118.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">v</text><text x="30" y="196" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">Exports render inside the web request and time out</text><text x="30" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">on large communities. Move rendering to a worker.</text><text x="340" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555" text-anchor="start">icon: Copy link  (Y)</text><rect x="560" y="56" width="540" height="395" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="572" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">2 PR header</text><line x1="572" y1="83" x2="1088" y2="83" stroke="#999"/><text x="580" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Pin the node image in the build</text><rect x="580" y="140" width="54" height="20" rx="10" fill="#ddd" stroke="#333" stroke-width="1"/><text x="607.0" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Open</text><text x="644" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">acme-dev/acme-api #1318 . build-bot</text><text x="580" y="180" font-family="DejaVu Sans Mono, monospace" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">fix/pin-node-image  into  main</text><rect x="580" y="206" width="150" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="655.0" y="224.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">Open on GitHub</text><rect x="738" y="206" width="28" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><rect x="743.0" y="216.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="750.0" y="216.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><text x="778" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555" text-anchor="start">Copy link  (Y)</text><rect x="1110" y="56" width="540" height="395" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="1122" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">3 Check rows (PR merge box)</text><line x1="1122" y1="83" x2="1638" y2="83" stroke="#999"/><rect x="1124" y="100" width="512" height="38" rx="5" fill="#fff" stroke="#999" stroke-width="1"/><text x="1138" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#222" text-anchor="start">lint</text><text x="1230" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">passed 41s</text><rect x="1124" y="144" width="512" height="38" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1"/><text x="1138" y="168" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#222" text-anchor="start">rspec</text><text x="1230" y="168" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">failed 3m 12s</text><rect x="1588" y="149" width="28" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><rect x="1593.0" y="159.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="1600.0" y="159.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="1504" y="149" width="76" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="1542.0" y="167.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">Details</text><rect x="1124" y="188" width="512" height="38" rx="5" fill="#fff" stroke="#999" stroke-width="1"/><text x="1138" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#222" text-anchor="start">security</text><text x="1230" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">running</text><text x="1130" y="256" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">Hovered row (rspec) shows the icon: copies the check's</text><text x="1130" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">details URL. Rows with no URL show no icon.</text><rect x="10" y="463" width="540" height="395" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="22" y="483" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">4 List rows (issues and PRs)</text><line x1="22" y1="490" x2="538" y2="490" stroke="#999"/><rect x="24" y="507" width="512" height="62" rx="5" fill="#fff" stroke="#999" stroke-width="1"/><text x="40" y="533" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Rebuild the banner export pipeline</text><text x="40" y="553" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">acme-dev/notes #12 . acme-dev . 2h</text><rect x="24" y="577" width="512" height="62" rx="5" fill="#e6e6e6" stroke="#999" stroke-width="1"/><text x="40" y="603" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Unit status filter ignores closed communities</text><text x="40" y="623" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">acme-co/acme-api #412 . acme-dev . 2h</text><rect x="490" y="583" width="24" height="24" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><rect x="493.0" y="591.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="500.0" y="591.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="24" y="647" width="512" height="62" rx="5" fill="#fff" stroke="#999" stroke-width="1"/><text x="40" y="673" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Rotate agent token on service restart</text><text x="40" y="693" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">acme-dev/tools #9 . acme-dev . 2d</text><text x="30" y="733" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">Hover or j/k focus shows the icon, right end, top.</text><text x="30" y="749" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">Row click and keys are unchanged.</text><rect x="560" y="463" width="540" height="395" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="572" y="483" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">5 Comment card and sub-issue row</text><line x1="572" y1="490" x2="1088" y2="490" stroke="#999"/><rect x="580" y="507" width="500" height="110" rx="6" fill="#fff" stroke="#777" stroke-width="1"/><rect x="592" y="517" width="26" height="26" rx="3" fill="#ccc" stroke="#777" stroke-width="1"/><text x="605" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">B</text><text x="628" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">build-bot  commented  5d ago</text><rect x="1028" y="515" width="26" height="26" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><rect x="1032.0" y="524.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="1039.0" y="524.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><text x="592" y="571" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">Split into sub-issues so each piece can ship</text><text x="592" y="589" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">on its own. The worker queue goes first.</text><rect x="580" y="643" width="500" height="34" rx="5" fill="#fff" stroke="#999" stroke-width="1"/><text x="594" y="665" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">Move export rendering to a worker queue</text><text x="1040" y="665" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="end">#14</text><rect x="580" y="683" width="500" height="34" rx="5" fill="#e6e6e6" stroke="#999" stroke-width="1"/><text x="594" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">Banner export times out on large communities</text><text x="1040" y="705" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="end">#17</text><rect x="1052" y="687" width="26" height="26" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><rect x="1056.0" y="696.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="1063.0" y="696.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><text x="580" y="743" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">Comment header: icon copies the comment's own anchor link.</text><text x="580" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">Sub-issue row: copies that issue's URL.</text><rect x="1110" y="463" width="540" height="395" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="1122" y="483" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">6 Feedback</text><line x1="1122" y1="490" x2="1638" y2="490" stroke="#999"/><rect x="1140" y="511" width="28" height="28" rx="5" fill="#ddd" stroke="#333" stroke-width="1"/><rect x="1145.0" y="521.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><rect x="1152.0" y="521.0" width="11" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/><text x="1180" y="529" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">Pressed: icon swaps to a check for 1.5s, label Copied.</text><rect x="1140" y="563" width="200" height="34" rx="6" fill="#222" stroke="#222" stroke-width="1"/><text x="1240" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#fff" text-anchor="middle">Link copied</text><text x="1360" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">toast, bottom centre, 2s</text><rect x="1140" y="613" width="280" height="34" rx="6" fill="#fff" stroke="#333" stroke-width="1" stroke-dasharray="4 2"/><text x="1280" y="635" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">Could not copy link</text><text x="1440" y="635" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">failure toast</text><text x="1140" y="693" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="start">Notes</text><text x="1140" y="715" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">Key Y copies the focused item's link; y stays Ready for review.</text><text x="1140" y="733" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">Help sheet lists Y as copy link.</text><text x="1140" y="751" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">Phone already has Copy link in its action sheet; no phone change.</text><text x="1140" y="769" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">Which URL: the GitHub web URL of the item.</text></svg>