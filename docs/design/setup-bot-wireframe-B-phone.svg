<svg xmlns="http://www.w3.org/2000/svg" width="940" height="915" viewBox="0 0 940 915"><rect width="940" height="915" fill="#fff"/><text x="16" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Layout B (phone 412x915)</text><text x="16" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444" text-anchor="start">Settings write is loopback only, so a paired phone cannot change it.</text><rect x="16" y="56" width="412" height="835" rx="14" fill="#fafafa" stroke="#999" stroke-width="1"/><rect x="16" y="56" width="412" height="52" rx="14" fill="#eee" stroke="#999" stroke-width="1"/><text x="32" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">acme-api #367</text><text x="32" y="136" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222" text-anchor="start">Restrict client IP header trust to the proxy</text><rect x="32" y="148" width="60" height="22" rx="11" fill="#fff" stroke="#777" stroke-width="1"/><text x="62" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Open</text><line x1="32" y1="186" x2="412" y2="186" stroke="#999"/><rect x="32" y="200" width="380" height="110" rx="6" fill="#fff" stroke="#555" stroke-width="1" stroke-dasharray="4 2"/><text x="46" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#222" text-anchor="start">BOT</text><text x="46" y="246" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#222" text-anchor="start">No bot is set up.</text><text x="46" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">Turn one on in Settings on the desktop.</text><rect x="46" y="274" width="352" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="222.0" y="292.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">How to set up</text><text x="32" y="340" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222" text-anchor="start">Decide first</text><line x1="32" y1="360" x2="412" y2="360" stroke="#bbb"/><line x1="32" y1="382" x2="372" y2="382" stroke="#bbb"/><line x1="32" y1="404" x2="332" y2="404" stroke="#bbb"/><rect x="16" y="560" width="412" height="331" rx="14" fill="#fff" stroke="#333" stroke-width="2"/><text x="32" y="588" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Actions</text><rect x="28" y="602" width="388" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1"/><text x="42" y="625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">Start work</text><rect x="28" y="644" width="388" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1"/><text x="42" y="667" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">Dispatch with Orca</text><rect x="28" y="686" width="388" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1"/><text x="42" y="709" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">Close as completed</text><rect x="28" y="728" width="388" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1"/><text x="42" y="751" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">Not planned</text><rect x="470" y="200" width="450" height="130" rx="6" fill="#fff" stroke="#555" stroke-width="1" stroke-dasharray="4 2"/><text x="484" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="start">Phone note</text><text x="484" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">On a paired phone the row opens a note, not Settings:</text><text x="484" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Turn the bot on in Settings on the desktop.</text></svg>