<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="870" viewBox="0 0 1660 870"><rect width="1660" height="870" fill="#fff"/><text x="16" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Layout B - one Copy menu per item, with formats (desktop 1660x870)</text><text x="16" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444" text-anchor="start">Round 1, greyscale. Headers get a Copy menu button. Rows, checks and comments get a ... menu with Copy link first. Key Y copies the link, shift-Y opens the menu. Sample data synthetic.</text><rect x="10" y="56" width="540" height="395" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="22" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">1 Issue header</text><line x1="22" y1="83" x2="538" y2="83" stroke="#999"/><text x="30" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Rebuild the banner export pipeline</text><rect x="30" y="140" width="54" height="20" rx="10" fill="#ddd" stroke="#333" stroke-width="1"/><text x="57.0" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Open</text><text x="94" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">acme-dev/notes #12 . opened 6d ago</text><rect x="310" y="100" width="74" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="347.0" y="118.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">Edit title</text><rect x="390" y="100" width="66" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="402" y="118.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Copy</text><text x="442" y="118.0" font-family="DejaVu Sans Mono, monospace" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">v</text><rect x="462" y="100" width="28" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="476.0" y="118.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">^</text><rect x="496" y="100" width="28" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="510.0" y="118.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="middle">v</text><text x="30" y="196" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">Exports render inside the web request and time out</text><text x="30" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">on large communities. Move rendering to a worker.</text><rect x="560" y="56" width="540" height="395" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="572" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">2 PR header</text><line x1="572" y1="83" x2="1088" y2="83" stroke="#999"/><text x="580" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Pin the node image in the build</text><rect x="580" y="140" width="54" height="20" rx="10" fill="#ddd" stroke="#333" stroke-width="1"/><text x="607.0" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">Open</text><text x="644" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start">acme-dev/acme-api #1318 . build-bot</text><text x="580" y="180" fo