<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="870" viewBox="0 0 1660 870"><rect width="1660" height="870" fill="#fff"/><text x="16" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">Layout B - the switch sits above the org list (Settings > GitHub)</text><text x="16" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#444" text-anchor="start">Round 1, greyscale. Three states of the same pane. Sample orgs synthetic.</text><rect x="10" y="56" width="810" height="390" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="24" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">1 Orgs set, switch on (new default)</text><line x1="24" y1="86" x2="806" y2="86" stroke="#999"/><text x="34" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">GitHub</text><text x="34" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Orgs Nod watches for PRs and issues. Add your own login to include your personal repos.</text><rect x="34" y="170" width="36" height="20" rx="10" fill="#555" stroke="#333" stroke-width="1"/><circle cx="60" cy="180" r="7" fill="#fff"/><text x="82" y="185" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Also show things I'm involved in</text><text x="328.8" y="185" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">On</text><text x="34" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Adds PRs and issues where you are author, assignee, reviewer or mentioned, in any repo.</text><text x="34" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="start">Orgs</text><rect x="34" y="258" width="480" height="32" rx="5" fill="#fff" stroke="#777" stroke-width="1"/><text x="44" y="278.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Bloomfield-Homes</text><rect x="530" y="258" width="112" height="32" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="586.0" y="278.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">x Remove</text><rect x="34" y="298" width="480" height="32" rx="5" fill="#fff" stroke="#777" stroke-width="1"/><text x="44" y="318.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">acme-web</text><rect x="530" y="298" width="112" height="32" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="586.0" y="318.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">x Remove</text><rect x="34" y="338" width="112" height="32" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="90.0" y="358.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">+ Add org</text><rect x="34" y="384" width="632" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1" stroke-dasharray="4 2"/><text x="44" y="404" font-family="DejaVu Sans Mono, monospace" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">Searching: (org:Bloomfield-Homes OR org:acme-web OR involves:@me)</text><rect x="830" y="56" width="810" height="390" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="844" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">2 Orgs set, switch off (old behaviour)</text><line x1="844" y1="86" x2="1626" y2="86" stroke="#999"/><text x="854" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">GitHub</text><text x="854" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Orgs Nod watches for PRs and issues. Add your own login to include your personal repos.</text><rect x="854" y="170" width="36" height="20" rx="10" fill="#fff" stroke="#333" stroke-width="1"/><circle cx="864" cy="180" r="7" fill="#999"/><text x="902" y="185" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Also show things I'm involved in</text><text x="1148.8" y="185" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Off</text><text x="854" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Adds PRs and issues where you are author, assignee, reviewer or mentioned, in any repo.</text><text x="854" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="start">Orgs</text><rect x="854" y="258" width="480" height="32" rx="5" fill="#fff" stroke="#777" stroke-width="1"/><text x="864" y="278.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Bloomfield-Homes</text><rect x="1350" y="258" width="112" height="32" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="1406.0" y="278.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">x Remove</text><rect x="854" y="298" width="480" height="32" rx="5" fill="#fff" stroke="#777" stroke-width="1"/><text x="864" y="318.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">acme-web</text><rect x="1350" y="298" width="112" height="32" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="1406.0" y="318.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">x Remove</text><rect x="854" y="338" width="112" height="32" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="910.0" y="358.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">+ Add org</text><rect x="854" y="384" width="632" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1" stroke-dasharray="4 2"/><text x="864" y="404" font-family="DejaVu Sans Mono, monospace" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">Searching: org:Bloomfield-Homes org:acme-web</text><rect x="10" y="456" width="810" height="390" rx="6" fill="#fafafa" stroke="#999" stroke-width="1"/><text x="24" y="478" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">3 No orgs (switch has no effect)</text><line x1="24" y1="486" x2="806" y2="486" stroke="#999"/><text x="34" y="526" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222" text-anchor="start">GitHub</text><text x="34" y="548" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Orgs Nod watches for PRs and issues. Add your own login to include your personal repos.</text><rect x="34" y="570" width="36" height="20" rx="10" fill="#555" stroke="#333" stroke-width="1" stroke-dasharray="4 2"/><circle cx="60" cy="580" r="7" fill="#fff"/><text x="82" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#888" text-anchor="start">Also show things I'm involved in</text><text x="328.8" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">On</text><text x="34" y="610" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">Adds PRs and issues where you are author, assignee, reviewer or mentioned, in any repo.</text><text x="34" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="start">Orgs</text><rect x="34" y="658" width="112" height="32" rx="5" fill="#fff" stroke="#333" stroke-width="1"/><text x="90.0" y="678.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">+ Add org</text><rect x="34" y="704" width="632" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1" stroke-dasharray="4 2"/><text x="44" y="724" font-family="DejaVu Sans Mono, monospace" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">Searching: involves:@me</text><rect x="830" y="456" width="810" height="390" rx="6" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="4 2"/><text x="844" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Notes</text><text x="844" y="508" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Existing Settings > GitHub pane, 632 wide inside the 880x640 dialog.</text><text x="844" y="532" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">The switch is the existing Switch: 36x20, the word On or Off beside it.</text><text x="844" y="556" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Default is On, so a file that already lists orgs gains your own repos</text><text x="844" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">until you turn it off.</text><text x="844" y="604" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">With no orgs the search is already involves:@me, so the switch is</text><text x="844" y="628" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">shown on and locked, with the Searching line as the reason.</text><text x="844" y="652" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">The grey Searching line is read-only and shows the exact query.</text><text x="844" y="676" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">GitHub allows five AND/OR operators per search. With the switch on,</text><text x="844" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">4 orgs fit. A 5th org shows a field error until the switch is off.</text><text x="844" y="724" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">The first org still owns the project board and Status. The caption</text><text x="844" y="748" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">under the org list says so.</text><text x="844" y="772" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">Save restarts the service, as today. Desktop only.</text></svg>